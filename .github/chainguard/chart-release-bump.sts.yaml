# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
#
# octo-sts trust policy "chart-release-bump": lets release.yml, triggered by a
# published release tag, push the Chart.yaml version bump back to main.
#
# The main branch ruleset requires pull requests and cannot bypass-list the
# built-in GITHUB_TOKEN (github-actions[bot] is not an installable
# integration), so the bump push authenticates as the octo-sts[bot] App,
# which is bypass-listed on the ruleset. Scope is limited to release tags of
# this repository's release workflow, and the token only gets contents:write.
issuer: https://token.actions.githubusercontent.com
subject_pattern: 'repo:castai(@44625431)?/gcp-disk-compatibility-webhook(@1098303703)?:ref:refs/tags/.*'
claim_pattern:
  repository: castai/gcp-disk-compatibility-webhook
  repository_id: "1098303703"
  job_workflow_ref: castai/gcp-disk-compatibility-webhook/\.github/workflows/release\.yaml@refs/tags/.*
permissions:
  contents: write
  pull-requests: write
