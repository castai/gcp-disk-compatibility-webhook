name: Release

on:
  release:
    types:
      - published

env:
  CHART_PATH: "${{ github.workspace }}/charts/gcp-disk-compatibility-webhook"

jobs:
  release_docker:
    name: Release Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5

      - name: Get release tag
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release (docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/castai/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/castai/${{ github.repository }}:latest
          build-args: |
            CAST_COMMIT_SHA=${{ github.sha }}
            CAST_COMMIT_REF=${{ github.ref }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}

  release_chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: release_docker
    permissions:
      contents: write # the Chart.yaml commit back to main (main is not protected)
      id-token: write # keyless chart signature; token for castai/helm-charts
      packages: write # push to ghcr.io/castai/gcp-disk-compatibility-webhook/helm-charts/<chart>
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      # Bumps Chart.yaml, pushes the chart signed to this repository's GHCR namespace, then
      # castai/helm-charts publish-chart.yml verifies it and publishes the release + index.yaml;
      # finally commits the Chart.yaml bump back to main with the job's GITHUB_TOKEN (a push
      # made with that token starts no workflow, so main.yaml does not rebuild for the bump).
      - name: Release chart
        uses: castai/helm-charts/.github/actions/remote-release@f9cc3faad410ab5053609e68f61f28b4ade2ae41 # signs and publishes through publish-chart.yml
        with:
          chart-path: ${{ env.CHART_PATH }}
