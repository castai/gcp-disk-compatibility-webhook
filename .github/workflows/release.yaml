name: Release

on:
  release:
    types:
      - published

env:
  CHART_PATH: "${{ github.workspace }}/charts/gcp-disk-compatibility-webhook"

jobs:
  release_docker:
    name: Release Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5

      - name: Get release tag
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release (docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # NOTE: no owner prefix in the tags below — github.repository already
          # contains it. The previous hardcoded 'ghcr.io/castai/${{ github.repository }}'
          # produced ghcr.io/castai/castai/... (a private stray package), so
          # release tags like v0.3.0 never existed on the real package that
          # main.yaml and consumers use.
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            CAST_COMMIT_SHA=${{ github.sha }}
            CAST_COMMIT_REF=${{ github.ref }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}

  release_chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: release_docker
    permissions:
      contents: write # GHCR chart push and GitHub API access via GITHUB_TOKEN
      id-token: write # keyless chart signature; OIDC for octo-sts
      packages: write # push to ghcr.io/castai/gcp-disk-compatibility-webhook/helm-charts/<chart>
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      # The Chart.yaml bump is pushed back to main with an octo-sts[bot] App token,
      # not GITHUB_TOKEN: the main branch ruleset requires pull requests and the
      # built-in github-actions app cannot be bypass-listed on rulesets, while
      # octo-sts[bot] is. Trust policy: .github/chainguard/chart-release-bump.sts.yaml
      # (release tags of this workflow only, contents: write).
      - name: Get a token to push the chart bump
        id: bump_token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: castai/gcp-disk-compatibility-webhook
          identity: chart-release-bump

      # Bumps Chart.yaml, pushes the chart signed to this repository's GHCR namespace, then
      # castai/helm-charts publish-chart.yml verifies it and publishes the release + index.yaml;
      # finally commits the Chart.yaml bump back to main with the octo-sts token (a push
      # made with that token starts no workflow, so main.yaml does not rebuild for the bump).
      - name: Release chart
        uses: castai/helm-charts/.github/actions/remote-release@84d1e2ea1ea89c5d7b648bb90c38116d8b4d08b8 # signs and publishes through publish-chart.yml
        with:
          chart-path: ${{ env.CHART_PATH }}
          # Take the chart version (and appVersion) from the release tag
          # (vX.Y.Z -> X.Y.Z) instead of patch-bumping the checked-in
          # Chart.yaml, so the published chart always references the image
          # tag that this release actually pushed. Default (false) caused
          # chart 0.2.5 to be published with appVersion v0.2.5 while the
          # release image was v0.3.0.
          chart-version-from-tag: "true"
          source-repo-token: ${{ steps.bump_token.outputs.token }}
