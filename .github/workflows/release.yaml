name: Release

on:
  release:
    types:
      - published

env:
  CHART_PATH: "${{ github.workspace }}/charts/gcp-disk-compatibility-webhook"

jobs:
  release_docker:
    name: Release Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5

      - name: Get release tag
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release (docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/castai/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/castai/${{ github.repository }}:latest
          build-args: |
            CAST_COMMIT_SHA=${{ github.sha }}
            CAST_COMMIT_REF=${{ github.ref }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}

  release_chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: release_docker
    permissions:
      contents: write # GHCR chart push and GitHub API access via GITHUB_TOKEN
      id-token: write # keyless chart signature; OIDC for octo-sts
      packages: write # push to ghcr.io/castai/gcp-disk-compatibility-webhook/helm-charts/<chart>
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      # The Chart.yaml bump is pushed back to main with an octo-sts[bot] App token,
      # not GITHUB_TOKEN: the main branch ruleset requires pull requests and the
      # built-in github-actions app cannot be bypass-listed on rulesets, while
      # octo-sts[bot] is. Trust policy: .github/chainguard/chart-release-bump.sts.yaml
      # (release tags of this workflow only, contents: write).
      - name: Get a token to push the chart bump
        id: bump_token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: castai/gcp-disk-compatibility-webhook
          identity: chart-release-bump

      # Bumps Chart.yaml (chart-version-from-tag) and publishes the chart signed to this
      # repository's GHCR namespace; castai/helm-charts publish-chart.yml verifies it and
      # publishes the release + index.yaml. The Chart.yaml bump on main is landed separately
      # (see the Open chart bump PR step): direct pushes to main are blocked by the branch
      # ruleset, so the bump goes through a regular PR that CI validates and auto-merges
      # after review.
      - name: Release chart
        uses: castai/helm-charts/.github/actions/remote-release@f9cc3faad410ab5053609e68f61f28b4ade2ae41 # signs and publishes through publish-chart.yml
        with:
          chart-path: ${{ env.CHART_PATH }}
          # Take the chart version (and appVersion) from the release tag
          # (vX.Y.Z -> X.Y.Z) instead of patch-bumping the checked-in
          # Chart.yaml, so the published chart always references the image
          # tag that this release actually pushed. Default (false) caused
          # chart 0.2.5 to be published with appVersion v0.2.5 while the
          # release image was v0.3.0.
          chart-version-from-tag: "true"
          # The action's direct bump push to main is declined by the main
          # branch ruleset (the github-actions App cannot be bypass-listed,
          # and the octo-sts Integration bypass does not apply to git
          # pushes), so the bump is landed via a PR in the next step.
          commit-chart-changes: "false"

      # The action bumped Chart.yaml in the working tree (chart-version-from-tag).
      # Push it to a branch with the octo-sts token and open an auto-merge PR:
      # a branch/PR push with the App token triggers the required CI checks
      # (GITHUB_TOKEN-created PRs would not), and the PR merges once checks pass
      # and a maintainer approves.
      - name: Open chart bump PR
        env:
          GH_TOKEN: ${{ steps.bump_token.outputs.token }}
          CHART_PATH: ${{ env.CHART_PATH }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "${CHART_PATH}/Chart.yaml"; then
            echo "Chart.yaml unchanged — nothing to bump."
            exit 0
          fi
          BRANCH="chart-bump/${GITHUB_REF_NAME}"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "${CHART_PATH}/Chart.yaml"
          git commit -m "[Release] Update gcp-disk-compatibility-webhook Chart.yaml to ${GITHUB_REF_NAME}"
          git push origin "${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "[Release] Update gcp-disk-compatibility-webhook Chart.yaml to ${GITHUB_REF_NAME}" \
            --body "Automated Chart.yaml version bump for release ${GITHUB_REF_NAME} (chart version and appVersion derive from the release tag)."
          gh pr merge --auto --squash
