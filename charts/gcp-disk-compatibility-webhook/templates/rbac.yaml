apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gcp-disk-compatibility-webhook.serviceAccountName" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # Permissions required by cert-controller rotator
  ### TODO: Move this to a namespaced Role
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
subjects:
  - kind: ServiceAccount
    name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
    namespace: "{{ .Release.Namespace }}"
