apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcp-disk-compatibility-webhook.fullname" . }}
  labels:
    {{- include "gcp-disk-compatibility-webhook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "gcp-disk-compatibility-webhook.selectorLabels" . | nindent 4 }}

