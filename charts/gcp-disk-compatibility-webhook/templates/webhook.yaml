apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
webhooks:
  - name: disk-compatibility.cast.ai
    clientConfig:
      service:
        name: '{{ include "gcp-disk-compatibility-webhook.fullname" . }}'
        namespace: "{{ .Release.Namespace }}"
        path: "/mutate"
      # caBundle will be automatically populated by cert-controller rotator
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          # Do not try to modify self.
          values: ["{{ .Release.Namespace }}"]
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhookFailurePolicy | quote }}
