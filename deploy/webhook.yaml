apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: disk-compatibility-webhook
  annotations:
    # cert-controller will automatically inject the caBundle
    cert-manager.io/inject-ca-from: "disk-compatibility-webhook/disk-compatibility-webhook-certs"
webhooks:
- name: disk-compatibility.cast.ai
  clientConfig:
    service:
      name: disk-compatibility-webhook
      namespace: disk-compatibility-webhook
      path: "/mutate"
    # caBundle will be automatically populated by cert-controller rotator
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Ignore
  namespaceSelector:
    matchExpressions:
    - key: disk-compatibility-webhook
      operator: NotIn
      values:
      - ignore
