# statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ssd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-database
  template:
    metadata:
      labels:
        app: my-database
    spec:
      nodeSelector:
        existing-selector: should-be-kept
      containers:
        - name: postgres
          image: postgres:15
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  # This is where the storageClass is used
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ssd
        resources:
          requests:
            storage: 10Gi
